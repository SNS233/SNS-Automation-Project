<script>
    lucide.createIcons();

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Verifying...</span>';
        errorAlert.style.display = 'none';

        try {
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await resp.json();
            if (data.success) {
                window.location.href = '/';
            } else {
                errorMessage.textContent = data.error || 'Authentication failed.';
                errorAlert.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In</span><i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>';
                lucide.createIcons();
            }

            errorAlert.style.display = 'flex';
            submitBtn.disabled = false;

    function updateLoginThemeIcon() {
        var theme = document.documentElement.getAttribute('data-theme') || 'light';
        var icon = document.getElementById('loginThemeIcon');
        var text = document.getElementById('loginThemeText');
        if (icon) {
            icon.setAttribute('data-lucide', theme === 'dark' ? 'sun' : 'moon');
            icon.style.color = theme === 'dark' ? '#f59e0b' : '#64748b';
        }
        if (text) {
            text.textContent = theme === 'dark' ? 'Light' : 'Dark';
        }
        if (window.lucide) lucide.createIcons();
    }

    function toggleLoginTheme() {
        var curr = document.documentElement.getAttribute('data-theme') || 'light';
        var next = curr === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('app_theme', next);
        updateLoginThemeIcon();
    }
